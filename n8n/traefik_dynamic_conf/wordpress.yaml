#### YAML Reference for WordPress Service Configuration in Traefik
# This file defines how WordPress should be served through Traefik

http:
  routers:
    wordpress:
      rule: "Host(`wordpress.example.com`)"
      entrypoints:
        - "websecure"
      service: "wordpress"
      middlewares:
        - "cloudflare-real-ip@file"
        - "wordpress-headers@file"
        - "static-cache@file" 
        - "general-ratelimit@file"
        - "secure-headers@file"
        # Uncomment to enable maintenance mode
        # - "wordpress-maintenance@file"
        # Uncomment to enable country blocking
        # - "country-whitelist@file"
      tls:
        certResolver: "mytlschallenge"
        
    wordpress-admin:
      rule: "Host(`wordpress.example.com`) && (PathPrefix(`/wp-admin`) || PathPrefix(`/wp-login.php`))"
      entrypoints:
        - "websecure"
      service: "wordpress"
      middlewares:
        - "cloudflare-real-ip@file"
        - "wordpress-headers@file"
        - "wp-login-ratelimit@file"
        - "secure-headers@file"
      tls:
        certResolver: "mytlschallenge"

  services:
    wordpress:
      loadBalancer:
        servers:
          - url: "http://wordpress"