#### YAML Reference for Traefik Maintenance Page Plugin
# This plugin allows showing a maintenance page during updates or downtime
# You can enable/disable it by modifying this file without restarting Traefik

http:
  middlewares:
    wordpress-maintenance:
      plugin:
        maintenancepage:
          # Set to true to enable maintenance mode
          enabled: false
          statusCode: 503
          pageBody: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Site Maintenance</title>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 650px; margin: 0 auto; padding: 20px; text-align: center; }
                h1 { color: #2c3e50; margin-top: 40px; }
                .container { margin-top: 50px; }
                .message { background: #f8f9fa; border-left: 4px solid #5d6d7e; padding: 20px; border-radius: 4px; margin: 30px 0; text-align: left; }
                .footer { margin-top: 60px; font-size: 0.9em; color: #7f8c8d; }
              </style>
            </head>
            <body>
              <div class="container">
                <h1>⚙️ We're updating our site</h1>
                <div class="message">
                  <p>We're currently performing scheduled maintenance on our website. We'll be back online shortly.</p>
                  <p>Thank you for your patience.</p>
                </div>
                <div class="footer">
                  <p>© 2025 - Our Company</p>
                </div>
              </div>
            </body>
            </html>
          # List of IPs that can still access the site during maintenance
          allowedIPs:
            - "127.0.0.1"
            # Add your own IP here to access the site during maintenance
            # - "your.ip.address"
            
    n8n-maintenance:
      plugin:
        maintenancepage:
          enabled: false
          statusCode: 503
          pageBody: |
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>n8n Maintenance</title>
              <style>
                body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 650px; margin: 0 auto; padding: 20px; text-align: center; }
                h1 { color: #ff6d5a; margin-top: 40px; }
                .container { margin-top: 50px; }
                .message { background: #f8f9fa; border-left: 4px solid #ff6d5a; padding: 20px; border-radius: 4px; margin: 30px 0; text-align: left; }
                .footer { margin-top: 60px; font-size: 0.9em; color: #7f8c8d; }
              </style>
            </head>
            <body>
              <div class="container">
                <h1>🔧 n8n Maintenance</h1>
                <div class="message">
                  <p>Our automation platform is currently undergoing scheduled maintenance.</p>
                  <p>All workflows are safely paused and will resume when maintenance is complete.</p>
                  <p>Thank you for your patience.</p>
                </div>
                <div class="footer">
                  <p>© 2025 - Our Company</p>
                </div>
              </div>
            </body>
            </html>
          # List of IPs that can still access n8n during maintenance
          allowedIPs:
            - "127.0.0.1"
            # Add your own IP here