#### YAML Reference for Traefik Header Transformation Plugin
# This plugin is useful for WordPress behind a reverse proxy
# It helps fix issues with redirects and content URLs

http:
  middlewares:
    wordpress-headers:
      plugin:
        rewriteheaders:
          transformations:
            - target: 'X-Forwarded-Proto'
              set: 'https'
            - target: 'X-Forwarded-Host'
              copy: 'Host'
            - target: 'X-Forwarded-Uri'
              copy: 'Uri'
            # Fix WordPress admin redirects
            - target: 'Location'
              operation: replace
              regex: '^http://(.*)'
              replacement: 'https://$1'
              
    n8n-headers:
      plugin:
        rewriteheaders:
          transformations:
            - target: 'X-Forwarded-Proto'
              set: 'https'
            - target: 'X-Forwarded-Host'
              copy: 'Host'
            - target: 'X-Frame-Options'
              set: 'SAMEORIGIN'