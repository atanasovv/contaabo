services:
  error-page:
    image: nginx:alpine
    container_name: error_page
    restart: unless-stopped
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik_network
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      
      # Catchall router with lowest priority (catches everything not matched)
      - traefik.http.routers.catchall.rule=HostRegexp(`{host:.+}`)
      - traefik.http.routers.catchall.priority=1
      - traefik.http.routers.catchall.entrypoints=web,websecure
      - traefik.http.routers.catchall.tls=true
      - traefik.http.routers.catchall.service=error-page
      - traefik.http.services.error-page.loadbalancer.server.port=80
      
      # Add security headers
      - traefik.http.routers.catchall.middlewares=error-headers@docker
      - traefik.http.middlewares.error-headers.headers.SSLRedirect=true
      - traefik.http.middlewares.error-headers.headers.STSSeconds=315360000
      - traefik.http.middlewares.error-headers.headers.browserXSSFilter=true
      - traefik.http.middlewares.error-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.error-headers.headers.forceSTSHeader=true
      - traefik.http.middlewares.error-headers.headers.STSIncludeSubdomains=true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.1'
        reservations:
          memory: 16M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  traefik_network:
    external: true
    name: traefik_network