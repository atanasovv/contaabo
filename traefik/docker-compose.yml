services:
  traefik:
    image: "traefik:v3.0"
    restart: always
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=DEBUG"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.file.directory=/etc/traefik/dynamic_conf"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Temporarily disable HTTP to HTTPS redirection for local testing
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Remove ACME configuration - using self-signed certificates with Cloudflare
      # - "--certificatesresolvers.mytlschallenge.acme.httpchallenge=true"
      # - "--certificatesresolvers.mytlschallenge.acme.httpchallenge.entrypoint=web"
      # - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      # - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    networks:
      - traefik_network
    ports:
      - "80:80"
      - "443:443"
      # Dashboard port is not exposed directly to the internet
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic_conf:/etc/traefik/dynamic_conf
      - ./certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      # Dashboard configuration (using self-signed certificates) - Tailscale access only
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.internal.coach-bg.com`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=traefik-auth@file,secure-headers@file,tailscale-access"
      # Tailscale IP whitelist - same as phpMyAdmin
      - "traefik.http.middlewares.tailscale-access.ipwhitelist.sourcerange=100.64.0.0/10,172.16.0.0/12,127.0.0.1/32"
      # Note: In .env file, password hashes must have each $ escaped as $$ (see TRAEFIK-ENV-GUIDE.md)

      # "traefik.http.middlewares.traefik-ip-whitelist.ipallowlist.sourcerange=127.0.0.1/32,${ADMIN_IP_RANGE}"
      # Add security headers
      # Security headers are now defined in the dynamic configuration file

networks:
  traefik_network:
    name: traefik_network
    driver: bridge

volumes:
  traefik_data:
    name: traefik_data

