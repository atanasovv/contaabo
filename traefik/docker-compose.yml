services:
  traefik:
    image: "traefik:v3.0"
    restart: always
    container_name: traefik
    security_opt:
      - no-new-privileges:true
    env_file:
      - ../.env
    command:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.file.directory=/etc/traefik/dynamic_conf"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      # Temporarily disable HTTP to HTTPS redirection for local testing
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      # Remove ACME configuration - using self-signed certificates with Cloudflare
      # - "--certificatesresolvers.mytlschallenge.acme.httpchallenge=true"
      # - "--certificatesresolvers.mytlschallenge.acme.httpchallenge.entrypoint=web"
      # - "--certificatesresolvers.mytlschallenge.acme.email=${SSL_EMAIL}"
      # - "--certificatesresolvers.mytlschallenge.acme.storage=/letsencrypt/acme.json"
    networks:
      - traefik_network
    ports:
      - "80:80"
      - "443:443"
      # Dashboard port is not exposed directly to the internet
    volumes:
      - traefik_data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik_dynamic_conf:/etc/traefik/dynamic_conf
      - ./certs:/etc/traefik/certs:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls=true"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      # Only Tailscale access and security headers (no basic auth)
      - "traefik.http.routers.traefik-dashboard.middlewares=secure-headers@file,tailscale-access"
      - "traefik.http.middlewares.tailscale-access.ipallowlist.sourcerange=${ADMIN_IP_RANGE}"
  error-page:
      image: nginx:alpine
      container_name: error_page
      restart: unless-stopped
      env_file:
      - ../.env
      volumes:
        - ./error-page/index.html:/usr/share/nginx/html/index.html:ro
        - ./error-page/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      networks:
        - traefik_network
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik_network
        
        # Catchall router with lowest priority (catches everything not matched)
        - traefik.http.routers.catchall.rule=HostRegexp(`{host:.+}`)
        - traefik.http.routers.catchall.priority=1
        - traefik.http.routers.catchall.entrypoints=web,websecure
        - traefik.http.routers.catchall.tls=true
        - traefik.http.routers.catchall.service=error-page
        - traefik.http.services.error-page.loadbalancer.server.port=80
        
        # Add security headers
        - traefik.http.routers.catchall.middlewares=error-headers@docker
        - traefik.http.middlewares.error-headers.headers.SSLRedirect=true
        - traefik.http.middlewares.error-headers.headers.STSSeconds=315360000
        - traefik.http.middlewares.error-headers.headers.browserXSSFilter=true
        - traefik.http.middlewares.error-headers.headers.contentTypeNosniff=true
        - traefik.http.middlewares.error-headers.headers.forceSTSHeader=true
        - traefik.http.middlewares.error-headers.headers.STSIncludeSubdomains=true
      deploy:
        resources:
          limits:
            memory: 64M
            cpus: '0.1'
          reservations:
            memory: 16M
      security_opt:
        - no-new-privileges:true
      logging:
        driver: "json-file"
        options:
          max-size: "5m"
          max-file: "2"
     
networks:
  traefik_network:
    name: traefik_network
    driver: bridge

volumes:
  traefik_data:
    name: traefik_data

