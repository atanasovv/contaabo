server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Main location - serve error page with 403 status
    location / {
        try_files /index.html =403;
    }
    
    # Specific handling for health checks (return 200 to avoid logs)
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
    
    # Hide server information
    server_tokens off;
    
    # Logging with custom format to track blocked requests
    log_format blocked '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'BLOCKED';
    
    access_log /var/log/nginx/access.log blocked;
    error_log /var/log/nginx/error.log warn;
}