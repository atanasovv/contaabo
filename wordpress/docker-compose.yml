services:
  db:
    image: mysql:8.0.39
    container_name: wordpress_db
    restart: unless-stopped
    # Using default MySQL user (not specifying user)
    env_file:
      - ../.env
    environment:
      MYSQL_DATABASE: "${WP_DB_NAME}"
      MYSQL_USER: "${WP_DB_USER}"
      MYSQL_PASSWORD: "${WP_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "%"  # Allow root connections from any host
      # Additional settings for stability
      MYSQL_INITDB_SKIP_TZINFO: 1
    volumes:
      # Using a regular Docker volume instead of bind mount
      - mysql_data:/var/lib/mysql
      - ./mysql-conf:/etc/mysql/conf.d
      # mount local folder for the database backups and restores
      - ./data/mysql/backup:/var/backups/mysql
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 256M
    # security_opt:
    #   - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    image: wordpress:6.8.3-apache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: "${WP_DB_USER}"
      WORDPRESS_DB_PASSWORD: "${WP_DB_PASSWORD}"
      WORDPRESS_DB_NAME: "${WP_DB_NAME}"
      WORDPRESS_CONFIG_EXTRA: |
        // Skip WP_DEBUG as it's already defined in wp-config.php
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', false);
        define('DISALLOW_FILE_EDIT', true);
        define('DISALLOW_FILE_MODS', true);
        define('AUTOMATIC_UPDATER_DISABLED', true);
        define('WP_POST_REVISIONS', 3);
        define('AUTOSAVE_INTERVAL', 300);
        define('WP_MEMORY_LIMIT', '256M');
    volumes:
      - wordpress_data:/var/www/html
      - ./apache-conf:/etc/apache2/conf-enabled
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - traefik_network
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      # HTTP router (port 80)
      - traefik.http.routers.wordpress-http.rule=Host(`${WORDPRESS_HOST}`)
      - traefik.http.routers.wordpress-http.entrypoints=web
      - traefik.http.routers.wordpress-http.service=wordpress
      # HTTPS router (port 443)
      - traefik.http.routers.wordpress-https.rule=Host(`${WORDPRESS_HOST}`)
      - traefik.http.routers.wordpress-https.entrypoints=websecure
      - traefik.http.routers.wordpress-https.tls=true
      - traefik.http.routers.wordpress-https.service=wordpress
      # Service definition
      - traefik.http.services.wordpress.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.8'
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # phpMyAdmin - Only accessible via Tailscale VPN
  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: phpmyadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      HIDE_PHP_VERSION: "true"
      UPLOAD_LIMIT: "128M"
      MEMORY_LIMIT: "512M"
      # Fix token mismatch issues
      PMA_ABSOLUTE_URI: "https://${PHPMYADMIN_HOST}/"
      # Session configuration
      MAX_EXECUTION_TIME: 600
    volumes:
      - phpmyadmin_sessions:/sessions
    networks:
      - traefik_network
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_network
      - traefik.http.routers.phpmyadmin.rule=Host(`${PHPMYADMIN_HOST}`)
      - traefik.http.routers.phpmyadmin.entrypoints=websecure
      - traefik.http.routers.phpmyadmin.tls=true
      # Restrict access to Tailscale network only
      - traefik.http.routers.phpmyadmin.middlewares=tailscale-only,secure-headers@file
      # Tailscale IP whitelist + Docker networks + localhost
      - traefik.http.middlewares.tailscale-only.ipallowlist.sourcerange=${ADMIN_IP_RANGE}
      - traefik.http.services.phpmyadmin.loadbalancer.server.port=80
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.3'
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/index.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


volumes:
  mysql_data:
    # Using a regular Docker-managed volume instead of bind mount
    # This prevents permission issues during initialization
  wordpress_data:
    # Using a regular Docker-managed volume like mysql_data
    # This avoids permission issues entirely
  phpmyadmin_sessions:
    # Persistent sessions for phpMyAdmin to avoid token mismatch

networks:
  traefik_network:
    external: true
    name: traefik_network
